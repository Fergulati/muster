# Fork-only check for the voice-notes draft PR (not part of the PR): the module suite and the
# end-to-end voice self-test on Linux, which the contributor's Mac cannot run.
name: voice notes on Linux

on:
  workflow_dispatch:
  push:
    branches: [ci/voice-notes-linux]

permissions:
  contents: read

jobs:
  suite:
    name: module suite (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e # v1.2.0
      # On Linux run-suite.sh takes nim from PATH (only on macOS does it fetch one), and a
      # GitHub runner has none: every test then fails in 0 s. Take nixpkgs' nim, from the same
      # nixpkgs as the gcc, libsodium and libopus the suite builds on Linux, so its compiler
      # links the glibc they were built against.
      - name: Nim on PATH
        shell: bash
        run: |
          NIM=""
          for p in $(nix build nixpkgs#nim --no-link --print-out-paths); do
            [ -x "$p/bin/nim" ] && NIM="$p"
          done
          [ -n "$NIM" ] || { echo "nixpkgs#nim has no bin/nim"; exit 1; }
          echo "$NIM/bin" >> "$GITHUB_PATH"
          "$NIM/bin/nim" --version
          echo "cores: $(nproc)"
      - name: The voice and audio tests first
        shell: bash
        env:
          OUT: ${{ runner.temp }}/suite-voice
        run: JOBS="$(nproc)" module/tests/run-suite.sh voice audio session_pad
      # Its verdict is the next step's: a test that times itself (room_graph_scale_test) runs
      # here beside other tests' compiles on the same cores, and on these runners went 5 to 10
      # times slower than alone.
      - name: The whole suite
        id: all
        if: always()
        continue-on-error: true
        shell: bash
        env:
          OUT: ${{ runner.temp }}/suite-all
        run: JOBS="$(nproc)" module/tests/run-suite.sh
      # The whole suite's failures again, each alone on the runner: this step's result is the
      # suite's. A test that failed beside the others and passes alone is named in a warning.
      - name: The whole suite's failures, one at a time
        if: always() && steps.all.outcome == 'failure'
        shell: bash
        env:
          OUT: ${{ runner.temp }}/suite-alone
        run: |
          set +e
          names=$(grep '^FAIL' "$RUNNER_TEMP/suite-all/results" 2>/dev/null | awk '{print $2}' | sort)
          [ -n "$names" ] || { echo "the suite stopped before it ran a test"; exit 1; }
          filters=()
          for n in $names; do filters+=("/$n.nim"); done
          JOBS=1 module/tests/run-suite.sh "${filters[@]}"
          rc=$?
          alone=$(grep '^PASS' "$OUT/results" 2>/dev/null | awk '{print $2}' | sort | tr '\n' ' ')
          [ -z "$alone" ] || echo "::warning::failed with $(nproc) tests at a time, passed alone: $alone"
          exit $rc
      # Each failing test's log tail in the job log, so a red run reads without the artifact.
      - name: The failing tests' logs
        if: always()
        shell: bash
        run: |
          set +e
          for d in "$RUNNER_TEMP"/suite-voice "$RUNNER_TEMP"/suite-all "$RUNNER_TEMP"/suite-alone; do
            [ -f "$d/results" ] || continue
            for n in $(grep '^FAIL' "$d/results" | awk '{print $2}' | sort | head -40); do
              echo "::group::$(basename "$d") $n"
              tail -n 60 "$d/$n.log"
              echo "::endgroup::"
            done
          done
          exit 0
      - name: Keep the suite's logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-logs-${{ matrix.runs-on }}
          path: |
            ${{ runner.temp }}/suite-voice/
            ${{ runner.temp }}/suite-all/
            ${{ runner.temp }}/suite-alone/
          if-no-files-found: ignore

  selftest:
    name: voice self-test (runner, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e # v1.2.0
      - name: Build the standalone runner
        shell: bash
        run: BUILD_MEM= make build
      - name: voice-self-test.sh on the logos.dev fleet
        shell: bash
        run: KEEP_LOGS=1 scripts/voice-self-test.sh
      - name: voice-self-test.sh with MUSTER_FLEET=local
        if: always()
        shell: bash
        run: MUSTER_FLEET=local KEEP_LOGS=1 scripts/voice-self-test.sh
      # The self-test's scratch dir is mktemp -d, under the TMPDIR the nix action sets
      # (runner.temp), not /tmp: its logs, the WAV A recorded from and the PCM B played into.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-self-test-logs
          path: |
            ${{ runner.temp }}/tmp.*/*.log
            ${{ runner.temp }}/tmp.*/*.pcm
            ${{ runner.temp }}/tmp.*/*.wav
          if-no-files-found: ignore

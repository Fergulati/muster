<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muster Room Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Room map mock (docs/design/room-map.md, epic exo-dde).
   Layout: a header with the lenses, the map (an SVG with the room as a membrane at its centre),
   an inspector beside it, and the log's timeline under it. Tokens are Logos.Theme's own values,
   as in desktop-v3.html; dark first, with a light variant. */
:root{
  --bg:#171717; --bg-elev:#0E121B; --raised:#232323; --recessed:#1F1F1F; --surface:#343434;
  --text:#FFFFFF; --muted:#A3A8B3; --placeholder:#717784;
  --border:#434343; --border-subtle:#333333; --hairline:rgba(128,128,128,.2);
  --primary:#ED7B58; --primary-soft:#FFD5C0; --success:#6CCC93; --error:#FF736A; --warning:#FEBC2E; --info:#4A90E2;
  --focus:#FF8800;
  /* the map's own roles, derived from the theme */
  --membrane:rgba(237,123,88,.07); --membrane-edge:rgba(237,123,88,.45);
  --leave:#ED7B58; --enter:#5AA2F0; --store:#FEBC2E;
  --c-peer:#9AA5B8; --c-contrib:#6CCC93; --c-read:#5AA2F0; --c-plugin:#B993F5;
  --m-you:#F4F1EE; --m-alice:#B993F5; --m-bob:#56C7C1; --m-carol:#E9B061;
  --node-ink:#171717; --grid:rgba(255,255,255,.035);
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F5F3F1; --bg-elev:#E9EDF4; --raised:#FFFFFF; --recessed:#EEECEA; --surface:#E4E1DE;
  --text:#171717; --muted:#5B606B; --placeholder:#8A8F99;
  --border:#D6D2CE; --border-subtle:#E3DFDB; --hairline:rgba(0,0,0,.1);
  --primary:#D0552E; --primary-soft:#7A2E14; --success:#1E8A4F; --error:#C6362C; --warning:#A86A00; --info:#2D6CC0;
  --membrane:rgba(208,85,46,.06); --membrane-edge:rgba(208,85,46,.45);
  --leave:#D0552E; --enter:#2D6CC0; --store:#B07A00;
  --c-peer:#6B7587; --c-contrib:#1E8A4F; --c-read:#2D6CC0; --c-plugin:#7A4FC9;
  --m-you:#171717; --m-alice:#7A4FC9; --m-bob:#16827C; --m-carol:#B56F0C;
  --node-ink:#FFFFFF; --grid:rgba(0,0,0,.035);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F5F3F1; --bg-elev:#E9EDF4; --raised:#FFFFFF; --recessed:#EEECEA; --surface:#E4E1DE;
  --text:#171717; --muted:#5B606B; --placeholder:#8A8F99;
  --border:#D6D2CE; --border-subtle:#E3DFDB; --hairline:rgba(0,0,0,.1);
  --primary:#D0552E; --primary-soft:#7A2E14; --success:#1E8A4F; --error:#C6362C; --warning:#A86A00; --info:#2D6CC0;
  --membrane:rgba(208,85,46,.06); --membrane-edge:rgba(208,85,46,.45);
  --leave:#D0552E; --enter:#2D6CC0; --store:#B07A00;
  --c-peer:#6B7587; --c-contrib:#1E8A4F; --c-read:#2D6CC0; --c-plugin:#7A4FC9;
  --m-you:#171717; --m-alice:#7A4FC9; --m-bob:#16827C; --m-carol:#B56F0C;
  --node-ink:#FFFFFF; --grid:rgba(0,0,0,.035);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "map side" "time side";height:100%;padding-inline:16px;padding-block:12px;gap:12px}
header{grid-area:head;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.title{display:flex;flex-direction:column;min-width:0}
.title .eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title h1{margin:4px 0 0;font:600 20px/1.2 var(--ui);text-wrap:balance}
.title h1 span{color:var(--muted);font-weight:400}
.spacer{flex:1}
.lenses{display:flex;flex-wrap:wrap;gap:2px;background:var(--recessed);border:1px solid var(--border-subtle);border-radius:10px;padding:3px}
.lenses button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.lenses button:hover{color:var(--text)}
.lenses button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
.viewer{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.viewer select{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:5px 8px;color:var(--text)}
.mock{font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--border);border-radius:999px;padding:5px 9px}

.map{grid-area:map;position:relative;min-height:0;border:1px solid var(--border-subtle);border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 45% 50%, var(--bg-elev), var(--bg) 70%)}
.map svg{display:block;width:100%;height:100%}
.lens-note{position:absolute;left:14px;top:12px;max-width:min(380px,70%);font-size:12.5px;color:var(--muted);pointer-events:none}
.lens-note b{color:var(--text);font-weight:600}
.legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);pointer-events:none;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.legend i.dot{width:9px;height:9px;border:0;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}

aside{grid-area:side;min-height:0;overflow:auto;background:var(--raised);border:1px solid var(--border-subtle);border-radius:14px;padding:16px}
aside h2{margin:0;font:600 17px/1.25 var(--ui);text-wrap:balance}
aside .kicker{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
aside section{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px solid var(--hairline)}
aside section:last-child{border-bottom:0}
aside h3{margin:0;font:600 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
aside p{margin:0;color:var(--muted);font-size:13px}
aside p.lead{color:var(--text);font-size:13.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--ui);padding:4px 8px;border-radius:999px;border:1px solid currentColor}
.pill.final{color:var(--success)} .pill.exec{color:var(--success)} .pill.sub{color:var(--warning)} .pill.prop{color:var(--info)} .pill.sealed{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:400 11.5px/1 var(--mono);padding:4px 7px;border-radius:6px;background:var(--recessed);border:1px solid var(--border-subtle)}
.chip.out{border-color:color-mix(in srgb,var(--leave) 55%,transparent);color:var(--text)}
.rows{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.rows li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer}
.rows li:hover{background:var(--recessed)}
.rows li .n{font-family:var(--mono);color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.guarantee{border-left:2px solid var(--success);padding:6px 10px;background:color-mix(in srgb,var(--success) 7%,transparent);border-radius:0 6px 6px 0;font-size:12.5px;color:var(--text)}
.guarantee.claim{border-left-color:var(--warning);background:color-mix(in srgb,var(--warning) 7%,transparent)}
.btn{align-self:flex-start;border:1px solid var(--border);background:var(--recessed);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.obsrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px}
.obsrow .who{color:var(--muted)}

.time{grid-area:time;background:var(--raised);border:1px solid var(--border-subtle);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.play{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--recessed);cursor:pointer;display:grid;place-items:center}
.play:hover{border-color:var(--primary)}
.track{position:relative;min-width:0}
.track svg{display:block;width:100%;height:46px;overflow:visible}
.track input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}
.now{font-size:12.5px;min-width:0;grid-column:2}
.now b{font-weight:600}
.digest{grid-row:1/3;grid-column:3;text-align:right;font-size:11px;color:var(--muted)}
.digest .mono{display:block;color:var(--text);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}

/* SVG */
.n{transition:opacity .35s}
.n.hidden{opacity:0;pointer-events:none}
.n.dim{opacity:.16}
.n{cursor:pointer}
.n .halo{fill:none;stroke:var(--focus);stroke-width:2;opacity:0}
.n.sel .halo{opacity:1}
.n.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.n .inner{transform-box:fill-box;transform-origin:center}
.e{fill:none;transition:opacity .35s, stroke-width .25s}
path.e.hidden{opacity:0} path.e.dim{opacity:.07}
.e.leave{stroke:var(--leave);stroke-width:2.2;stroke-dasharray:3 7;animation:flow 1.1s linear infinite}
.e.enter{stroke:var(--enter);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.6s linear infinite}
.e.auth{stroke-width:1.6;opacity:.75}
.e.sig{stroke-width:1.1;opacity:.55}
.e.claim{stroke-dasharray:2 4}
.e.disc{stroke-width:1.2;stroke-dasharray:1 4;stroke-linecap:round;opacity:.8}
.e.parent{stroke:var(--muted);stroke-width:1;opacity:.45}
.e.prov{stroke-width:1.6;opacity:.85}
.e.bind{stroke:var(--text);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.e.strand{stroke:var(--store);opacity:.35}
.e.hot{opacity:1 !important}
@keyframes flow{to{stroke-dashoffset:-20}}
.membrane{transition:opacity .4s}
.membrane .ring{fill:none;stroke:var(--membrane-edge);stroke-width:1;stroke-dasharray:2 6;animation:spin 120s linear infinite;transform-origin:center;transform-box:fill-box}
.membrane.pulse .core{animation:pulse 1.2s ease-out}
@keyframes pulse{0%{stroke-width:1.5}30%{stroke-width:10;stroke-opacity:.9}100%{stroke-width:1.5}}
@keyframes spin{to{transform:rotate(360deg)}}
.lbl{fill:var(--text);font:500 12px var(--ui)}
.sub{fill:var(--muted);font:400 10.5px var(--ui)}
.tiny{fill:var(--muted);font:400 9.5px var(--mono)}
.band-lbl{fill:var(--muted);font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase}

@media (prefers-reduced-motion: reduce){
  .e.leave,.e.enter,.membrane .ring{animation:none}
  .n.pop{animation:none}
}
@media (max-width: 980px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto auto;grid-template-areas:"head" "map" "time" "side";height:auto}
  aside{overflow:visible}
}
@media (max-width: 560px){
  .app{grid-template-rows:auto auto auto auto}
  .map{aspect-ratio:1000/680}
  .legend{position:static;padding:0 12px 10px}
  .lens-note{display:none}
  .time{grid-template-columns:auto minmax(0,1fr)}
  .digest{grid-row:auto;grid-column:1/3;text-align:left}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <span class="eyebrow">Room map</span>
      <h1>Ops treasury <span id="hdrsub">· 4 members · epoch 2</span></h1>
    </div>
    <div class="spacer"></div>
    <div class="lenses" role="group" aria-label="Lens" id="lenses">
      <button data-lens="room" aria-pressed="true">Room</button>
      <button data-lens="me" aria-pressed="false">Me</button>
      <button data-lens="leaks" aria-pressed="false">Where it left</button>
      <button data-lens="prov" aria-pressed="false">Provenance</button>
      <button data-lens="log" aria-pressed="false">Log</button>
    </div>
    <label class="viewer" for="viewer">Viewing as
      <select id="viewer">
        <option value="you">You (founder, epoch 0)</option>
        <option value="carol">Carol (joined epoch 2)</option>
      </select>
    </label>
    <span class="mock" title="A sample room. No crypto runs on this page.">Mock · sample room</span>
  </header>

  <div class="map" id="map">
    <svg id="svg" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The room drawn as a graph">
      <defs>
        <radialGradient id="mem" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--membrane)" stop-opacity="0"/>
          <stop offset="78%" stop-color="var(--primary)" stop-opacity=".05"/>
          <stop offset="100%" stop-color="var(--primary)" stop-opacity=".14"/>
        </radialGradient>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="7" height="7" fill="var(--recessed)"/>
          <line x1="0" y1="0" x2="0" y2="7" stroke="var(--border)" stroke-width="3"/>
        </pattern>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="memArc" d=""/>
      </defs>
      <g id="bands"></g>
      <g id="membrane" class="membrane">
        <circle class="fill" fill="url(#mem)"/>
        <circle class="core" fill="none" stroke="var(--membrane-edge)" stroke-width="1.5"/>
        <circle class="ring"/>
        <text class="band-lbl" dy="-8"><textPath href="#memArc" startOffset="50%" text-anchor="middle" id="memText">the room · end-to-end</textPath></text>
      </g>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
    <div class="lens-note" id="lensNote"></div>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
  </div>

  <aside id="side" aria-live="polite"></aside>

  <div class="time">
    <button class="play" id="play" aria-label="Replay the log">
      <svg width="14" height="14" viewBox="0 0 14 14" id="playIcon"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>
    </button>
    <div class="track">
      <svg id="ticks" viewBox="0 0 1000 46" preserveAspectRatio="none"></svg>
      <input type="range" id="scrub" min="0" max="28" value="28" aria-label="Log position">
    </div>
    <div class="digest">state digest<span class="mono" id="digest"></span></div>
    <div class="now" id="now"></div>
  </div>
</div>

<script>
/* ── The sample room's log, in canonical order ────────────────────────────────
   Keys follow the real ones (intent/<id>/<kind>/…, message/<id>, membership/<e>/admit/<who>,
   account/<caip10>/disclose/<who>). Guarantee strings are logProvenance's own. */
const MEMBERS = {
  you:   {name:"You",   joined:0, color:"--m-you",   auth:"0x7A3f…09c1", enc:"ed25519:4b1e…a7"},
  alice: {name:"Alice", joined:0, color:"--m-alice", auth:"0xA11c…5e02", enc:"ed25519:9c0d…31"},
  bob:   {name:"Bob",   joined:1, color:"--m-bob",   auth:"0xB0b5…41e2", enc:"ed25519:e2f7…0b"},
  carol: {name:"Carol", joined:2, color:"--m-carol", auth:"0xCa70…77d4", enc:"ed25519:15aa…c9"},
};
const OBS = {
  store: {label:"Store node",     sub:"delivery infrastructure"},
  rpc:   {label:"RPC provider",   sub:"each sender's own endpoint"},
  chain: {label:"Chain observer", sub:"anyone reading Sepolia"},
  quote: {label:"Price source",   sub:"the proposer's rate"},
};
const OBS_TEXT = {
  store:"Every entry reaches the room as a sealed envelope on one topic. The store node keeps them, so it sees when each arrived and which topic it belongs to. It holds no epoch key and cannot open one (FS-9).",
  rpc:"The endpoint a member sends through sees that member's signed transaction before the mempool does, and the address it came from. Each member chooses their own (invariant 8).",
  chain:"Anyone reading the public ledger. It learns what the driver's manifest declares at the moment of settlement, never before: nothing leaves at propose or approve.",
  quote:"An outside source of a fiat rate. The room took the rate in; it is recorded as an external read, so its origin is accountable. It is not proof the world agrees (F-10).",
};
const INTENTS = {
  A:{label:"Pay the auditor", amount:"1.5 ETH", family:"Safe 2-of-3 · Sepolia", kind:"safe",
     detail:"1.5 ETH from the treasury Safe to 0xA0d1…09c3", slots:["you","alice","owner3"], need:2},
  B:{label:"Split dinner", amount:"0.0312 ETH", family:"evm.split · Sepolia", kind:"split",
     detail:"Three shares of 0.0104 ETH to Bob's shared address. Bob agrees as creditor; each debtor agrees and pays their own share.", slots:["bob","you","alice","carol"], need:4, parts:["you","alice","carol"]},
};
const G = {
  message:"Sealed to the room's epoch and signed by its author, bound to this room. The room's views read it only if that signature verifies.",
  propose:"Sealed to the room's epoch: only a member could have placed it. Every client re-derives the materialization (F-4).",
  policy:"Sealed to the room's epoch; every member folds the identical driver (invariant 6).",
  context:"Every attestation commits to it, so an approval is worthless in any other environment, account, slot, or after expiry (invariant 2).",
  read:"An external read: what the source reported, recorded so its origin is accountable. Not proof the world agrees (F-10).",
  sig:"The driver verified this recovers to a configured member. A non-member never reaches the fold.",
  attest:"Signed by the approving key over the context, the materialization, and the provenance of every input (invariants 2 and 10). Every member re-derives what it must cover.",
  admit:"Sealed under the new epoch by the admitting member. The joiner reads from here on, nothing before (F-16).",
  account:"Checked against the chain by every client: the address must be the account the disclosed config derives.",
  share:"An address the member chose to share into the room. The room learns the address, not that the member controls it.",
  submit:"The settlement the room assembled, re-derived and sent. What leaves is what the driver's manifest declares.",
  final:"The chain's answer as the room observed it, through the reader's own endpoint.",
  part:"An author-signed report on one part. A debtor's \"paid\" is a claim; only the creditor's own read confirms it.",
};
const SAFE_OUT = ["to","value","data","operation","nonce","gas","payer","policy","signers"];
const SPLIT_OUT = ["payer","payee","amount","group-linkage"];
const LOG = [
  {k:"message", who:"alice", text:"The auditor's invoice came in: 1.5 ETH.", p:[]},
  {k:"account", who:"alice", text:"Disclosed the treasury Safe (2 of 3)", acct:"safe", enters:{from:"rpc", what:"owners and threshold"}, p:[0]},
  {k:"message", who:"you", text:"I'll propose it once Bob is in.", p:[1]},
  {k:"admit", who:"bob", epoch:1, p:[2]},
  {k:"propose", who:"you", i:"A", p:[3]},
  {k:"policy", i:"A", text:"safe@eip155:11155111:0x5afe…E841", p:[4]},
  {k:"context", i:"A", text:"Sepolia · the Safe · nonce 7 · expires in 24 h", p:[4]},
  {k:"read", i:"A", text:"Safe nonce = 7", enters:{from:"rpc", what:"the Safe's nonce"}, p:[4]},
  {k:"sig", who:"you", i:"A", p:[5,6,7]},
  {k:"attest", who:"you", i:"A", p:[8]},
  {k:"sig", who:"alice", i:"A", p:[5,6,7]},
  {k:"attest", who:"alice", i:"A", p:[10]},
  {k:"message", who:"bob", text:"Not an owner, so I'll watch this one.", p:[3]},
  {k:"submit", who:"you", i:"A", leaves:[{to:"rpc", f:["signed-tx"], carries:["you"]},{to:"chain", f:SAFE_OUT, carries:["you","alice"]}], p:[9,11]},
  {k:"final", i:"A", enters:{from:"chain", what:"inclusion at depth"}, p:[13]},
  {k:"share", who:"bob", text:"Shared an address: 0xB0b5…41e2", p:[12]},
  {k:"admit", who:"carol", epoch:2, p:[14,15]},
  {k:"propose", who:"bob", i:"B", p:[16]},
  {k:"read", i:"B", text:"EUR quote: 1 ETH = €2,690", enters:{from:"quote", what:"the EUR/ETH rate"}, p:[17]},
  {k:"context", i:"B", text:"Sepolia · Bob's address · expires in 7 days", p:[17]},
  {k:"sig", who:"bob", i:"B", text:"the creditor agrees by proposing", p:[18,19]},
  {k:"sig", who:"you", i:"B", p:[18,19]},
  {k:"sig", who:"alice", i:"B", p:[18,19]},
  {k:"sig", who:"carol", i:"B", p:[18,19]},
  {k:"message", who:"carol", text:"Paying mine tonight.", p:[23]},
  {k:"part", who:"you", i:"B", step:"settled", leaves:[{to:"rpc", f:["signed-tx"], carries:["you"]},{to:"chain", f:SPLIT_OUT, carries:["you","bob"]}], p:[20,21,22,23]},

    it.entries.push(x);

}

function render(opts = {}){

      nodeEls[n.id] = g;

      g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
      g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); select(n.id); } });
      g.addEventListener("mouseenter", () => hover(n.id, true));
      g.addEventListener("mouseleave", () => hover(n.id, false));
      if (opts.pop && !reduced){ g.classList.add("pop"); setTimeout(() => g.classList.remove("pop"), 520); }
    }

function spawnPoint(n){

  if (n.id.startsWith("i:") && cur["x:" + LOG.find(x => x.i === n.id.slice(2) && x.k === "propose")?.seq]) return cur["x:" + LOG.find(x => x.i === n.id.slice(2) && x.k === "propose").seq];

}
function sinkPoint(id){
  if (id.startsWith("x:")){ const x = LOG[+id.slice(2)]; const t = x.i && tgt["i:" + x.i]; if (t && model.nodes.some(n => n.id === "i:" + x.i)) return t; }
  return null;
}
function drawStrands(m){
  const g = document.getElementById("edges");
  [...g.querySelectorAll(".strand")].forEach(s => s.remove());
  if (!m.strands || !tgt["o:store"]) return;
  const w = Math.max(.6, Math.log2(m.strands + 1) * .55);
  for (let j = -2; j <= 2; j++){
    const p = el("path", {class:"e strand", "stroke-width":w, "data-strand":j}, g);

let raf = 0;

    const c = cur[id] ||= {...tgt[id]}, t = tgt[id];
    const dx = t.x - c.x, dy = t.y - c.y;
    if (Math.abs(dx) > .3 || Math.abs(dy) > .3){ c.x += dx * k; c.y += dy * k; moving = true; } else { c.x = t.x; c.y = t.y; }
    const g = nodeEls[id]; if (g) g.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y.toFixed(1)})`);
  }
  for (const key of ["cx","cy","r","o"]){
    const d = memTgt[key] - memCur[key];
    if (Math.abs(d) > .01){ memCur[key] += d * (key === "o" ? .2 : k); moving = true; } else memCur[key] = memTgt[key];
  }
  const mem = document.getElementById("membrane");
  mem.style.opacity = memCur.o;
  mem.querySelectorAll("circle").forEach(c => { c.setAttribute("cx", memCur.cx); c.setAttribute("cy", memCur.cy); c.setAttribute("r", c.classList.contains("ring") ? memCur.r + 9 : memCur.r); });

  document.getElementById("memArc").setAttribute("d", `M ${memCur.cx - a} ${memCur.cy} A ${a} ${a} 0 0 1 ${memCur.cx + a} ${memCur.cy}`);
  for (const id in edgeEls){
    const p = edgeEls[id], e = p._e;
    const A = cur[e.from], B = cur[e.to];
    if (!A || !B){ p.setAttribute("d", ""); continue; }

}
function rOf(id){ const g = nodeEls[id]; if (!g || !g._n) return 10; const n = g._n; if (n.type === "observer") return n.big ? 60 : 34; if (n.type === "sealedband") return 0; return nodeRadius(n) + 3; }

      <section><p class="lead">${esc(n.sub)}.</p><p>${n.id === "k:auth" ? "It signs your approvals. The driver checks that each signature recovers to a configured member; the binding ties it to your encryption identity, so the room knows an admitted member approved." : "It opens the room's sealed envelopes for every epoch you were admitted to, and none before. Each admission re-keys the room forward."}</p>
      <div class="guarantee">Operations only: the keystore signs or opens. Nothing can read the key out (FS-4).</div></section>`;
  } else if (n.type === "sealed" || n.type === "sealedband"){
    h = `<div class="kicker">Sealed</div><h2>Before you joined</h2>
      <section><p class="lead">${n.count} envelopes from epochs before your admission. You can count them, because the store node serves them on the room's topic. You cannot open them: your client never held those epochs' keys.</p>
      <div class="guarantee">Membership epochs are real: a joiner reads from its own admission on (invariant 7, F-16). This map cannot show what this device cannot decrypt.</div></section>`;
  } else if (n.type === "entry"){
    const x = n.x_;
    const claim = x.k === "message" || x.k === "share";
    h = `<div class="kicker">Log entry #${x.seq} · epoch ${x.ep}</div><h2>${esc(entryTitle(x))}</h2>
      <section>${x.text ? `<p class="lead">${esc(x.text)}</p>` : ""}
      <dl class="kv"><dt>Class</dt><dd>${x.cls}</dd><dt>${claim ? "Author (claimed)" : "Account"}</dt><dd>${x.who ? MEMBERS[x.who].name : "—"}</dd>
      <dt>Content id</dt><dd class="mono">${x.cid}…</dd><dt>Parents</dt><dd class="mono">${x.p.map(p => LOG[p].ep < st.rf ? "sealed" : "#" + p).join(", ") || "none (a root)"}</dd></dl>
      <div class="guarantee${claim ? " claim" : ""}">${G[x.k]}</div></section>
      ${x.leaves ? `<section><h3>Left the room here</h3>${x.leaves.map(l => `<div class="obsrow"><span class="who">${OBS[l.to].label}</span><span class="chips">${l.f.map(f => `<span class="chip out">${f}</span>`).join("")}</span></div>`).join("")}</section>` : ""}
      ${x.enters ? `<section><h3>Came into the room here</h3><p>${esc(x.enters.what)}, from the ${OBS[x.enters.from].label.toLowerCase()}.</p></section>` : ""}
      <section><button class="btn" data-seek="${x.seq}">Replay to here</button></section>`;
  } else if (n.type === "bytes"){
    h = `<div class="kicker">Invariants 1 and 10</div><h2>The signed bytes</h2>
      <section><p class="lead">The materialization of the effect, with the provenance record P committed inside it. Each input on the left is named in P by class, author and content id.</p>
      <div class="guarantee">This device re-derived the materialization from the effect and refuses on mismatch. Signing is refused if any input's origin cannot be accounted for.</div></section>`;
  }
  side.innerHTML = h;
  side.querySelectorAll("[data-seq]").forEach(li => li.addEventListener("click", () => { const s = +li.dataset.seq; setLens("log"); select("x:" + s); }));
  side.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => setLens(b.dataset.go)));
  side.querySelectorAll("[data-seek]").forEach(b => b.addEventListener("click", () => seek(+b.dataset.seek)));
}

/* ── Lens notes and legend ─────────────────────────────────────────────────── */
const NOTES = {
  room:"<b>The room.</b> Members and what they decided sit inside the boundary. Orange lines carry information out; blue dashed lines bring outside reads in.",
  me:"<b>Me.</b> Your keys, what you put in the room, and which of it then left. Everything else is dimmed.",
  leaks:"<b>Where it left.</b> Each outside observer and exactly the fields it learned, placed at the entry where they left.",
  prov:"<b>Provenance.</b> Every input that reached the signed bytes, by class, then the approvals over them.",
  log:"<b>The log.</b> Every entry you can open, in canonical order, linked to its parents by hash.",
};
const LEGENDS = {
  room:[["leave","Left the room"],["enter","Came in"],["store","To the store node"]],
  me:[["leave","Left, carrying you"],["bind","Your keys"]],
  leaks:[["leave","Left the room"],["enter","Came in"],["store","To the store node"]],
  prov:[["dot:--c-peer","Peer message"],["dot:--c-read","External read"],["dot:--c-contrib","Driver contribution"]],
  log:[["dot:--c-peer","Peer message"],["dot:--c-read","External read"],["dot:--c-contrib","Driver contribution"],["leave","Left the room here"]],
};
function renderNote(){
  document.getElementById("lensNote").innerHTML = NOTES[S.lens];
  const c = {leave:"var(--leave)", enter:"var(--enter)", store:"var(--store)", bind:"var(--text)"};
  document.getElementById("legend").innerHTML = LEGENDS[S.lens].map(([k, t]) => k.startsWith("dot:")
    ? `<span><i class="dot" style="background:var(${k.slice(4)})"></i>${t}</span>`
    : `<span><i style="border-color:${c[k]};${k === "enter" ? "border-top-style:dashed" : k === "leave" ? "border-top-style:dotted" : ""}"></i>${t}</span>`).join("");
}

/* ── Epoch bands behind the log lens ───────────────────────────────────────── */
function renderBands(st){
  const g = document.getElementById("bands"); g.textContent = "";
  if (S.lens !== "log") return;
  const N = LOG.length, x0 = 64, x1 = 950, X = s => x0 + s * (x1 - x0) / (N - 1);
  const starts = [0, ...LOG.filter(x => x.k === "admit").map(x => x.seq)];
  starts.forEach((s, j) => {
    const e = starts[j + 1] ?? N;
    const a = X(s) - 14, b = (e < N ? X(e) - 14 : x1 + 30);
    el("rect", {x:a, y:70, width:b - a, height:560, fill: j % 2 ? "var(--grid)" : "transparent"}, g);
    el("line", {x1:a, x2:a, y1:70, y2:630, stroke:"var(--hairline)"}, g);
    const t = el("text", {class:"band-lbl", x:a + 8, y:88 + (j % 2) * 14}, g); t.textContent = j === 0 ? "epoch 0" : `epoch ${j} · ${MEMBERS[LOG[s].who].name} in`;
  });
  [["room", 150, "room"], ["Pay the auditor", 345, "A"], ["Split dinner", 530, "B"]].forEach(([t, y]) => {
    const l = el("text", {class:"tiny", x:8, y:y - 22}, g); l.textContent = t;
    el("line", {x1:50, x2:960, y1:y, y2:y, stroke:"var(--hairline)", "stroke-dasharray":"2 4"}, g);
  });
}

/* ── Timeline ──────────────────────────────────────────────────────────────── */
const ticks = document.getElementById("ticks"), scrub = document.getElementById("scrub");
scrub.max = LOG.length - 1;
function renderTime(st){
  ticks.textContent = "";
  const N = LOG.length, X = s => 8 + s * 984 / (N - 1);
  const starts = [0, ...LOG.filter(x => x.k === "admit").map(x => x.seq)];
  starts.forEach((s, j) => { const e = starts[j + 1] ?? N; el("rect", {x:X(s) - 6, y:4, width:(e < N ? X(e) : 1000) - X(s), height:30, fill: j % 2 ? "var(--grid)" : "transparent"}, ticks); });
  if (st.rf > 0){ const last = LOG.filter(x => x.ep < st.rf).pop().seq; el("rect", {x:2, y:4, width:X(last) + 6, height:30, fill:"url(#hatch)", opacity:.9}, ticks); }
  for (const x of LOG){
    if (x.ep < st.rf) continue;
    const on = x.seq <= S.k;
    const c = x.leaves ? "var(--leave)" : `var(${CLS_COLOR[x.cls]})`;
    el("rect", {x:X(x.seq) - 2.5, y: x.leaves ? 6 : 12, width:5, height: x.leaves ? 26 : 18, rx:1.5, fill:c, opacity: on ? 1 : .22}, ticks);
  }
  el("line", {x1:X(S.k), x2:X(S.k), y1:0, y2:40, stroke:"var(--text)", "stroke-width":1.5, "vector-effect":"non-scaling-stroke"}, ticks);
  const x = LOG[S.k];
  const visible = x.ep >= st.rf;
  document.getElementById("now").innerHTML = `<b>#${S.k}</b> · ${visible ? esc(entryTitle(x)) : "a sealed envelope"} <span style="color:var(--muted)">· epoch ${x.ep}</span>`;
  document.getElementById("digest").textContent = st.digest.slice(0, 16);
  scrub.value = S.k;
}
function seek(k, pop){ const prev = S.k; S.k = Math.max(0, Math.min(LOG.length - 1, k));
  render({pop: pop || S.k > prev});
  const x = LOG[S.k];
  if (x.k === "admit" && S.k > prev){ const m = document.getElementById("membrane"); m.classList.remove("pulse"); void m.getBBox(); m.classList.add("pulse"); }
}
scrub.addEventListener("input", () => { stop(); seek(+scrub.value); });
let timer = null;
const playBtn = document.getElementById("play");
function stop(){ if (timer){ clearInterval(timer); timer = null; } playBtn.setAttribute("aria-label", "Replay the log"); document.getElementById("playIcon").innerHTML = '<path d="M3 1.5v11l9-5.5z" fill="currentColor"/>'; }
playBtn.addEventListener("click", () => {
  if (timer){ stop(); return; }
  if (S.k >= LOG.length - 1) seek(readFirst());
  playBtn.setAttribute("aria-label", "Pause");
  document.getElementById("playIcon").innerHTML = '<rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/>';
  timer = setInterval(() => { if (S.k >= LOG.length - 1){ stop(); return; } seek(S.k + 1, true); }, 900);
});
const readFirst = () => LOG.find(x => x.ep >= readFromOf(S.viewer)).seq;

/* ── Lens and viewer controls ──────────────────────────────────────────────── */
function setLens(l){
  S.lens = l;
  document.querySelectorAll("#lenses button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lens === l)));
  if (l === "prov" && S.sel && !S.sel.startsWith("i:") && !S.sel.startsWith("x:")) S.sel = null;
  render();
}
document.querySelectorAll("#lenses button").forEach(b => b.addEventListener("click", () => setLens(b.dataset.lens)));
document.getElementById("viewer").addEventListener("change", ev => {
  S.viewer = ev.target.value; S.sel = null;
  if (S.viewer === "carol") S.prov = "B";
  for (const id in nodeEls){ nodeEls[id].remove(); delete nodeEls[id]; delete cur[id]; delete tgt[id]; }
  render({pop:true});
});
document.addEventListener("keydown", ev => {
  if (ev.target.closest("select,input")) return;
  if (ev.key === "ArrowRight"){ stop(); seek(S.k + 1); } else if (ev.key === "ArrowLeft"){ stop(); seek(S.k - 1); }
  else if (ev.key === "Escape" && S.sel){ S.sel = null; applyDim(); renderSide(model.st); }
});
window.addEventListener("resize", () => tip.classList.remove("on"));

// deep links: #log, #leaks, #carol-room … (a bare token, so it survives the artifact's frame)
(function(){
  const h = (location.hash || "").slice(1).split("-");
  if (h[0] === "carol"){ S.viewer = "carol"; S.prov = "B"; document.getElementById("viewer").value = "carol"; h.shift(); }
  if (NOTES[h[0]]){ S.lens = h[0]; document.querySelectorAll("#lenses button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lens === S.lens))); }
})();
render({snap:true});
</script>
</body>
</html>

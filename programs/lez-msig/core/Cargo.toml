[package]
name = "msig_core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The rules of an M-of-N multisig on LEZ, as pure functions (docs/design/lez-msig.md). No LEZ dependency: adapters map it onto v0.3's plan/apply and dev's actors."

[dependencies]
borsh = { version = "1.5.7", features = ["derive"] }
sha2 = { version = "0.10.8", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["schnorr", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[features]
default = []
# Signing helpers for hosts and tests. A guest never signs.
signing = ["k256/std", "dep:rand_core"]

[dev-dependencies]
k256 = { version = "0.13.4", features = ["schnorr", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
proptest = "1"
msig_core = { path = ".", features = ["signing"] }

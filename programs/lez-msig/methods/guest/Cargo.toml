[package]
name = "msig_guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "msig"
path = "src/bin/msig.rs"

[dependencies]
msig_core = { path = "../../core" }
msig_v03 = { path = "../../v03" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.3.0" }
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }

[profile.release]
lto = true
opt-level = 3

# RISC Zero's accelerated forks, in the guest only: BIP-340 verification uses the zkVM's
# bigint circuit instead of plain RISC-V arithmetic (docs/design/lez-msig.md D3, RFP P.2).
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }

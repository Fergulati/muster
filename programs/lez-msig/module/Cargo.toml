[package]
name = "lez_msig_module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "lez-msig's private posture as a Logos module: proves and sends its privacy-preserving transactions."

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
msig_host = { path = "../host" }
logos-rust-sdk.workspace = true
tokio = { version = "1.50", features = ["rt", "macros"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
msig_core = { workspace = true, features = ["signing"] }
borsh.workspace = true
